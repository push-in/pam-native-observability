name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict --no-check-lock
      - name: Preflight locked dependencies
        run: composer install --dry-run --prefer-dist --no-interaction --no-progress
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run package contracts
        run: |
          composer check

  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          tools: composer:v2
          coverage: none
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the official Collector image signature
        run: |
          cosign verify \
            --certificate-identity='https://github.com/open-telemetry/opentelemetry-collector-releases/.github/workflows/base-release.yaml@refs/tags/v0.157.0' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            'ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.157.0@sha256:4019ce4d7e7791a1a255fffb2f407af66d5017cc65543469ba565c4f47f795b8'
      - name: Preflight locked dependencies
        run: composer install --dry-run --prefer-dist --no-interaction --no-progress
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Certify all OTLP signals against the official Collector
        run: scripts/certify-collector.sh
